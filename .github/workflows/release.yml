name: Release

# Runs only when a version tag is pushed (git tag v0.0.3 && git push origin v0.0.3),
# or by hand from the Actions tab. A manual run publishes the release v<VERSION> too, using the tag
# if it exists. Ordinary pushes and pull requests do not start it.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: Get the sources
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git clone --no-checkout "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" .
          git fetch --depth 1 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
      - name: Install LLVM 18
        run: sudo apt-get update && sudo apt-get install -y clang-18 llvm-18 && sudo ln -sf /usr/bin/clang-18 /usr/local/bin/clang
      - name: Check the tag matches VERSION
        if: startsWith(github.ref, 'refs/tags/')
        run: test "${GITHUB_REF_NAME}" = "v$(cat VERSION)"
      - name: Build (stage1 and stage2 IR must match)
        run: make
      - name: Check the seeds follow the sources
        run: |
          make seed
          git diff --exit-code bootstrap/
      - name: Test
        run: make test
      - name: Package
        run: tools/package_release.sh
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$(cat VERSION)"
          gh release create "$TAG" dist/*.tar.gz dist/*.tar.gz.sha256 \
            --target "$GITHUB_SHA" \
            --title "Zue $TAG" \
            --notes "Linux x86-64 build of the Zue compiler. Unpack it and run bin/zue. It needs clang 18 or newer on the machine. See README.md."
