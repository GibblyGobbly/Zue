name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install LLVM 18
        run: sudo apt-get update && sudo apt-get install -y clang-18 llvm-18 && sudo ln -sf /usr/bin/clang-18 /usr/local/bin/clang
      - name: Build (stage1 and stage2 IR must match)
        run: make
      - name: Check the seeds follow the sources
        run: |
          make seed
          git diff --exit-code bootstrap/
      - name: Test
        run: make test
